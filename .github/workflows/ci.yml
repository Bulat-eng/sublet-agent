name: ci

on:
  pull_request:
  push:
    branches: [main]
    # The hunt workflow commits state.db to main every ~15 min. Without this
    # ignore, each of those bot commits would trigger a full CI run (~96/day)
    # that could not possibly fail differently from the last one.
    paths-ignore:
      - "state.db"
  workflow_dispatch:

# A new push to a PR makes the in-flight run obsolete — drop it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Catches syntax errors and bad imports anywhere in the pipeline before
      # they reach main — where they would silently kill the scheduled hunt.
      - name: Import every module
        run: |
          python - <<'PY'
          import config, filter, notifier, models, db, main, scam, scam_data, check_listing
          from sources import craigslist, listings_project, spareroom, reddit, ohana
          print("all modules import OK")
          PY

      # Region routing is load-bearing: filter._assign_region returns the FIRST
      # region that matches, so REGIONS order decides where listings land — and,
      # since 0.8.0, which rent cap they're held to.
      - name: Region routing + rent cap tests
        run: python test_regions.py

      # Real scams must stay flagged and real posts clean (SCAM_FILTER.md).
      - name: Scam score tests
        run: python test_scam.py

      # A price the Reddit parser misses skips the rent cap entirely.
      - name: Reddit price parsing tests
        run: python test_reddit.py

      - name: Config integrity
        run: |
          python - <<'PY'
          import config

          keywords = [h for r in config.REGIONS.values() for h in r["neighborhoods"]]
          dupes = {k for k in keywords if keywords.count(k) > 1}
          assert not dupes, f"keyword(s) in more than one region: {sorted(dupes)}"

          for key, region in config.REGIONS.items():
              assert region["neighborhoods"], f"region {key!r} has no neighborhoods"
              for field in ("label", "emoji"):
                  assert region.get(field), f"region {key!r} is missing {field!r}"

          # Every keyword is lowercased — _hood_regex compiles with IGNORECASE,
          # but filter.py lowercases matches, so mixed case here is a mistake.
          bad_case = [k for k in keywords if k != k.lower()]
          assert not bad_case, f"keywords must be lowercase: {bad_case}"

          # SpareRoom area paths look like "<borough>/<area>".
          for area in config.SPAREROOM_AREAS:
              assert area.count("/") == 1 and " " not in area, f"bad SpareRoom path: {area!r}"

          # A CHEAPER_AREAS entry that isn't an exact REGIONS keyword never
          # matches, so that area would silently keep the higher cap.
          unknown = sorted(set(config.CHEAPER_AREAS) - set(keywords))
          assert not unknown, f"CHEAPER_AREAS not in REGIONS: {unknown}"

          # EXCLUDED_AREAS is checked before REGIONS, so a keyword in both would
          # silently reject that whole area — drop it from REGIONS instead.
          clash = sorted(set(config.EXCLUDED_AREAS) & set(keywords))
          assert not clash, f"keyword(s) in both EXCLUDED_AREAS and REGIONS: {clash}"

          # Scrapers fetch server-side up to MAX_RENT, so it must be the higher
          # cap or listings between the two would never be fetched at all.
          assert config.CHEAPER_AREA_MAX_RENT <= config.MAX_RENT, (
              "CHEAPER_AREA_MAX_RENT must not exceed MAX_RENT")

          # scam_data tables are keyed by REGIONS keywords; a typo'd key is
          # silently never used (no subway / landmark check for that area).
          import scam_data
          bad = sorted(set(scam_data.AREA_LINES) - set(keywords))
          assert not bad, f"scam_data.AREA_LINES keys not in REGIONS: {bad}"
          bad = sorted({a for areas in scam_data.LANDMARKS.values() for a in areas} - set(keywords))
          assert not bad, f"scam_data.LANDMARKS areas not in REGIONS: {bad}"
          assert config.SCAM_FLAG_SCORE < config.SCAM_LIKELY_SCORE, "SCAM_FLAG_SCORE must be below SCAM_LIKELY_SCORE"

          print(f"config OK — {len(config.REGIONS)} regions, {len(keywords)} keywords, "
                f"{len(config.EXCLUDED_AREAS)} excluded, "
                f"{len(config.SPAREROOM_AREAS)} SpareRoom areas")
          PY
